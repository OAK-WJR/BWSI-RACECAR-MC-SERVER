services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    stdin_open: true
    tty: true

    # Only the game port is published. RCON (25575) stays inside the network.
    networks: [mcnet]
    ports:
      - "25565:25565"

    # Players and community plugins must not be able to reach the host.
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Other services share this host, so cap what Minecraft can take.
    mem_limit: 6g
    cpus: 4.0
    pids_limit: 512

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      # Pinned: CoreProtect has no build for 26.2 yet. ViaVersion lets newer clients in.
      VERSION: "26.1.2"
      MEMORY: "4G"
      SERVER_NAME: "BWSI Racecar"
      MOTD: "BWSI Racecar"
      LEVEL: "BWSI Racecar"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "20"
      VIEW_DISTANCE: "10"
      ONLINE_MODE: "TRUE"
      USE_AIKAR_FLAGS: "TRUE"
      TZ: "UTC"
      RCON_PASSWORD: ${RCON_PASSWORD}
      MODRINTH_PROJECTS: "coreprotect,luckperms,worldedit,worldguard,viaversion"

    volumes:
      - ./data:/data

    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 3m
      interval: 30s
      retries: 10

  # Hourly world backups, kept 7 days.
  backups:
    image: itzg/mc-backup:latest
    container_name: minecraft-backups
    restart: unless-stopped
    networks: [mcnet]
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    environment:
      BACKUP_INTERVAL: "1h"
      PRUNE_BACKUPS_DAYS: "7"
      RCON_HOST: "mc"
      RCON_PASSWORD: ${RCON_PASSWORD}
      INITIAL_DELAY: "5m"
      TZ: "UTC"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups

networks:
  mcnet:
    driver: bridge
