# Race world and start pose. scripts/gen_track.py prints these when it
# builds the track, and writes the matching sim/track_meta.json.
world: "test"
start:
  x: 150.5
  y: -59.0
  z: 0.5
  yaw: 0.0

# Directories inside this plugin's data folder, shared with the host-side
# runner through the ./data volume.
dirs:
  queue: "queue"
  results: "results"

hologram:
  enabled: true
  x: 150.5
  y: -45.0
  z: 0.5
  lines: 10

replay:
  enabled: true
  podium-seconds: 10
  # the car is 0.44 m long; scale it by the track's blocks per metre
  car-scale: 8.0

submit:
  max-code-bytes: 32768
  cooldown-seconds: 10

# The submission desk by the start line: stand on the plate holding your book
# to submit, take a blank book from the chest. scripts/gen_kiosk.py builds it
# and prints these coordinates.
kiosk:
  enabled: false
  plate: {x: -94, y: -59, z: 25}
  chest: {x: -97, y: -59, z: 23}
  books: 16
